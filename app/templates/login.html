{% extends 'base.html' %}

{% block title %}Log in · Weekview{% endblock %}

{% block content %}
<div class="auth-wrap">
  <section class="auth-card">
    <div class="auth-heading">
      <h1>Welcome back</h1>
      <p class="muted">Log in to see and manage your weekly calendar.</p>
    </div>
    <form method="post" action="{{ url_for('auth.login') }}" class="auth-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next_path }}">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
    <p class="auth-switch muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </section>
</div>
{% endblock %}
